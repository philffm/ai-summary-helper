# Secret scan (gitleaks, see .github/workflows/ci.yml). Default rules, plus the known false positives below.
# A real finding: rotate the secret first, then remove it. Only a value that is public by design belongs here,
# with the reason next to it. A one-off historical finding goes in .gitleaksignore (its fingerprint), not here.
[extend]
useDefault = true

[allowlist]
description = "Values that are public by design, test vectors and generated files"
paths = [
  # Figma component keys in the design-system manifest (public library ids, not credentials)
  '''^design-system/(dist/)?components\.json$''',
  # fixed test vectors shared by the extension and the Android app (made-up keys, needed to check the crypto)
  '''^plugin/tests/fixtures/(article-v1|inbox)-vector\.json$''',
  '''^mobile/android/app/src/test/resources/(article-v1|inbox)-vector\.json$''',
  # build output (git-ignored, only present locally)
  '''^plugin/dev/''',
  '''^node_modules/''',
]
regexes = [
  # YouTube's public web-player key, built into every watch page; content/youtube.js prefers the page's own key
  '''AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8''',
  # IndexNow key: public by design, it is served as docs/<key>.txt
  '''74c386394ab84165be6a819f1e91dc5f''',
  # made-up pairing key in a test
  '''AISH-TEST-[0-9a-f]+''',
]
