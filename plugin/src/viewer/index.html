<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aish-viewer" content="{{VERSION}}">
<!-- Everything shown comes from library.json and is inserted as text, never as HTML. d3 is loaded only when the Timeline or Graph view is opened. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
:root { --bg:#faf8ff; --card:#ffffff; --text:#0f172a; --text2:#334155; --muted:#566274; --accent:#2563eb; --outline:rgba(100,116,139,.28); --mark:#fef08a; --ghost:#dbeafe; --chip:#eef2ff; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b0e14; --card:#141923; --text:#e8edf5; --text2:#b8c4d4; --muted:#94a3b8; --accent:#60a5fa; --outline:rgba(148,163,184,.25); --mark:#4a3f0f; --ghost:#10304a; --chip:#1b2436; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 "Hanken Grotesk", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width:960px; margin:0 auto; padding:28px 16px 64px; }
h1 { font-size:clamp(26px,5vw,40px); line-height:1.1; margin:0 0 6px; letter-spacing:-.02em; }
.sub { color:var(--muted); margin:0 0 18px; }
.bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
input[type=search] { flex:1 1 260px; min-width:0; font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--outline); background:var(--card); color:var(--text); }
select, .seg button { font:inherit; font-size:14px; border:1px solid var(--outline); background:var(--card); color:var(--text2); border-radius:999px; padding:7px 14px; cursor:pointer; }
.seg { display:flex; gap:4px; flex-wrap:wrap; }
.seg button[aria-pressed=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 14px; }
.tag { font:inherit; font-size:13px; border:1px solid transparent; background:var(--chip); color:var(--text2); border-radius:999px; padding:3px 11px; cursor:pointer; }
.tag[aria-pressed=true] { background:var(--accent); color:#fff; }
.tag small { opacity:.7; margin-left:4px; }
.count { color:var(--muted); font-size:14px; margin:4px 0 12px; }
.card { background:var(--card); border:1px solid var(--outline); border-radius:16px; padding:14px 16px; margin:0 0 12px; }
.card h2 { font-size:18px; line-height:1.3; margin:0 0 2px; }
.card h2 a { color:var(--text); text-decoration:none; } .card h2 a:hover { color:var(--accent); text-decoration:underline; }
.meta { color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:4px 12px; }
.sum { margin:8px 0 0; color:var(--text2); font-size:15px; } .sum.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.sum p { margin:0 0 6px; } .sum ul { margin:0 0 6px; padding-left:20px; } .sum h4 { margin:6px 0 2px; font-size:15px; }
.cm { margin-top:4px; font-size:13px; color:var(--text2); }
.sky-note { color:var(--muted); font-size:14px; margin-top:6px; }
.sky-fs { position:fixed; inset:0; z-index:50; background:#03050b; color:#e8edf5; overflow:hidden; font-family:inherit; }
.sky-fs canvas, .sky-gl { position:absolute; inset:0; display:block; cursor:grab; }
.sky-labels { position:absolute; inset:0; pointer-events:none; }
.sky-label { position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer; background:none; border:0; padding:2px 8px; font:inherit; font-weight:700; letter-spacing:.01em; white-space:nowrap; text-shadow:0 0 12px #000,0 0 3px #000; will-change:transform; }
.sky-label:hover, .sky-label:focus-visible { text-decoration:underline; outline:none; }
.sky-bar { position:absolute; left:14px; right:14px; top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; z-index:3; }
.sky-b { font:inherit; font-size:13px; border:1px solid rgba(255,255,255,.2); background:rgba(10,15,30,.65); backdrop-filter:blur(8px); color:#dbe3f0; border-radius:999px; padding:6px 12px; cursor:pointer; }
.sky-b:hover, .sky-b:focus-visible { border-color:#7aa7ff; outline:none; }
.sky-b[aria-pressed=true] { background:#2563eb; border-color:#2563eb; color:#fff; }
.sky-b:disabled { opacity:.6; cursor:wait; }
.sky-fs .sky-search { flex:1 1 160px; max-width:320px; min-height:0; height:auto; font:inherit; font-size:13px; padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.2) !important; background:rgba(10,15,30,.65) !important; color:#e8edf5 !important; }
.sky-search:focus { outline:2px solid #7aa7ff; }
.sky-tip { display:none; position:absolute; pointer-events:none; max-width:260px; background:rgba(8,12,24,.92); color:#fff; font-size:12px; padding:6px 9px; border-radius:8px; z-index:4; }
.sky-caption { position:absolute; left:0; right:0; bottom:46px; text-align:center; pointer-events:none; opacity:0; transition:opacity .5s; font-size:20px; font-weight:700; text-shadow:0 0 14px #000; z-index:2; }
.sky-hint { position:absolute; left:14px; bottom:12px; font-size:12px; color:rgba(220,228,245,.65); z-index:2; pointer-events:none; }
.sky-legend { position:absolute; left:14px; top:64px; display:flex; flex-direction:column; gap:3px; z-index:2; max-height:calc(100% - 120px); overflow:auto; }
.sky-leg { display:flex; align-items:center; gap:7px; font:inherit; font-size:12px; color:#cdd6e6; background:none; border:0; padding:3px 6px; border-radius:8px; cursor:pointer; text-align:left; }
.sky-leg:hover, .sky-leg:focus-visible { background:rgba(255,255,255,.1); outline:none; }
.sky-leg i { width:9px; height:9px; border-radius:50%; flex:none; } .sky-leg span { opacity:.55; }
.sky-cross { display:none; position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border:1px solid rgba(255,255,255,.6); border-radius:50%; pointer-events:none; z-index:2; }
.sky-cross.on { display:block; }
.sky-side { display:none; position:absolute; right:14px; top:56px; bottom:14px; width:min(380px,calc(100% - 28px)); overflow:auto; background:rgba(12,18,34,.94); border:1px solid rgba(255,255,255,.15); border-radius:16px; padding:12px; z-index:5; color:var(--text, #e8edf5); }
.sky-side.open { display:block; }
.sky-close { font:inherit; font-size:12px; border:1px solid rgba(255,255,255,.25); background:none; color:#dbe3f0; border-radius:999px; padding:3px 10px; cursor:pointer; margin-bottom:8px; }
@media (max-width:640px) { .sky-legend { display:none; } .sky-side { top:auto; height:55%; } }
@media (prefers-reduced-motion: reduce) { .sky-caption { transition:none; } }
.more { font:inherit; font-size:13px; color:var(--accent); background:none; border:0; padding:4px 0; cursor:pointer; }
.hl { margin:8px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
.hl li { border-left:3px solid #eab308; background:var(--mark); border-radius:6px; padding:5px 9px; font-size:14px; }
.hl li.ghost { border-left-color:#0284c7; background:var(--ghost); }
.chart, .graph { background:var(--card); border:1px solid var(--outline); border-radius:16px; margin:0 0 14px; padding:10px; }
.chart svg, .graph svg { width:100%; height:auto; display:block; }
.note { color:var(--muted); font-size:14px; padding:18px; text-align:center; }
.err { color:#b91c1c; }
a { color:var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{TITLE}}</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar">
    <input type="search" id="q" placeholder="Search titles, summaries, highlights, tags…" aria-label="Search" autocomplete="off">
    <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="title">Title A to Z</option></select>
    <div class="seg" id="views" role="group" aria-label="View">
      <button type="button" data-view="list" aria-pressed="true">List</button>
      <button type="button" data-view="timeline" aria-pressed="false">Timeline</button>
      <button type="button" data-view="graph" aria-pressed="false">Graph</button>
      <button type="button" data-view="sky" aria-pressed="false">Sky</button>
      <button type="button" data-view="notes" aria-pressed="false" hidden>Notes</button>
    </div>
  </div>
  <div class="tags" id="tags" aria-label="Tags"></div>
  <div id="extra"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script src="aish-viewer.js"></script>
</body>
</html>
