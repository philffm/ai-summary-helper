openapi: 3.0.3
info:
  title: AISH phone inbox
  version: "1"
  description: |
    A tiny end-to-end encrypted inbox. A phone appends encrypted links; the AISH extension collects and acknowledges them.
    The server stores only SHA-256 hex hashes of two bearer tokens and opaque envelopes. Messages are AES-256-GCM
    (12-byte random nonce, additionalData = inbox id as UTF-8); envelope = { v: 1, data: base64url(nonce || ciphertext || tag) }.
    Never log request bodies. Reference implementation: reference-server.mjs.
servers:
  - url: https://api.byphil.eu/v1/projects/ai_summary_helper
paths:
  /aish_inboxes:
    post:
      summary: Create an inbox (extension)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, writeHash, readHash]
              properties:
                id: { type: string, pattern: '^[A-Za-z0-9_-]{22}$', description: 16 random bytes, base64url }
                writeHash: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 hex of the write token }
                readHash: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 hex of the read token }
      responses:
        "201": { description: Created }
        "400": { description: Malformed }
        "409": { description: Id already exists }
        "429": { description: Too many creations from this address (Retry-After) }
  /aish_inboxes/{id}:
    delete:
      summary: Delete the inbox and everything in it (read token)
      security: [{ readToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        "204": { description: Deleted }
        "401": { description: No token }
        "403": { description: Wrong token }
        "404": { description: Unknown inbox }
  /aish_inboxes/{id}/items:
    post:
      summary: Append an encrypted item (phone, write token)
      security: [{ writeToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [v, data]
              properties:
                v: { type: integer, enum: [1, 2], description: "1 = plaintext is JSON (a link, phone to extension). 2 = plaintext is gzip(JSON) (an article, extension to phone). The server never looks inside." }
                data: { type: string, maxLength: 190000, description: base64url(nonce || ciphertext || tag) }
      responses:
        "202": { description: Accepted }
        "400": { description: Malformed }
        "401": { description: No token }
        "403": { description: Wrong token }
        "404": { description: Unknown inbox }
        "413": { description: Body over 200 KB or data over 190,000 characters }
        "429": { description: Inbox full (200 items or 8 MB waiting; error "inbox-full") or over about 60 posts per hour (error "rate-limited", Retry-After) }
    get:
      summary: List items after a cursor (extension, read token)
      security: [{ readToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { name: after, in: query, schema: { type: string }, description: Opaque cursor of the last item already stored; omit for the beginning }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Items in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasMore: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        cursor: { type: string, description: Opaque, strictly increasing }
                        receivedAt: { type: integer, description: ms since epoch }
                        v: { type: integer }
                        data: { type: string }
        "401": { description: No token }
        "403": { description: Wrong token }
        "404": { description: Unknown inbox }
  /aish_inboxes/{id}/items/{itemId}:
    delete:
      summary: Delete one item (extension, read token). Sent once the user summarized or dismissed the link, so an item is never removed before that.
      security: [{ readToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Wrong token }
        "404": { description: Unknown inbox or item (treated as already deleted) }
  /aish_inboxes/{id}/ack:
    post:
      deprecated: true
      summary: Delete every item up to and including a cursor (read token). No longer used by the clients.
      security: [{ readToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string }
      responses:
        "200": { description: Acknowledged }
        "400": { description: Malformed }
        "403": { description: Wrong token }
        "404": { description: Unknown inbox }
  /aish_vaults:
    post:
      summary: Create a feed-URL sync vault (extension or phone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, tokenHash]
              properties:
                id: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
                tokenHash: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 hex of the vault token }
      responses:
        "201": { description: 'Created, body { id, rev: 0 }' }
        "400": { description: Malformed }
        "409": { description: Id already exists }
        "429": { description: Too many vaults from this address }
  /aish_vaults/{id}:
    get:
      summary: Download the vault document (vault token)
      security: [{ vaultToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        "200": { description: 'Body { rev, v: 1, data } where data is null until the first upload' }
        "403": { description: Wrong token }
        "404": { description: Unknown vault }
    put:
      summary: Replace the vault document if nobody else wrote since the revision you saw
      description: |
        Header If-Match: <rev>. The body is { v: 1, data: base64url(nonce || ciphertext || tag) }; AES-256-GCM, additionalData = vault id
        as UTF-8, same key as the pairing. On 409 the response carries the current { rev, v, data }: decrypt, merge, retry.
      security: [{ vaultToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        "200": { description: 'Stored, body { rev }' }
        "400": { description: Malformed }
        "409": { description: 'Someone else wrote first; body { error: conflict, rev, v, data }' }
        "413": { description: Document too large }
        "428": { description: If-Match missing }
        "429": { description: Too many writes this hour }
    delete:
      summary: Delete the vault (vault token)
      security: [{ vaultToken: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        "204": { description: Deleted }
        "403": { description: Wrong token }
components:
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
  securitySchemes:
    writeToken: { type: http, scheme: bearer }
    readToken: { type: http, scheme: bearer }
    vaultToken: { type: http, scheme: bearer }
x-limits:
  maxCreateBodyBytes: 4096
  maxItemBodyBytes: 200000
  maxItemDataChars: 190000   # base64url ciphertext; an article is gzipped to at most 135,000 bytes first
  maxWaitingChars: 8000000   # per inbox
  maxWaitingItems: 200
  postsPerHourPerInbox: 60
  itemTtl: 30 days   # items stay until the user summarizes or dismisses them
  idleInboxTtl: 30 days
  inboxCreatesPerHourPerIp: 20
x-vault-limits:
  maxPutBodyBytes: 100000
  maxDataChars: 80000   # roughly 500 feeds
  putsPerHourPerVault: 120
  vaultCreatesPerHourPerIp: 20
  idleVaultTtl: 365 days
