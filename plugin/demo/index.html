<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Summary Helper – live demo</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7fb;--card:#fff;--ink:#14161f;--dim:#5b6070;--line:#e3e6ef;--sig:#4c8dff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1017;--card:#171a23;--ink:#eef0f6;--dim:#9aa1b4;--line:#262a37}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,32vw,620px);gap:clamp(12px,1.4vw,24px);height:100%;padding:clamp(10px,1.2vw,20px)}
.page,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.bar{padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim);display:flex;gap:8px;align-items:center}.bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
article{padding:clamp(22px,2.4vw,44px) clamp(24px,3vw,56px);overflow:auto;font-size:clamp(16px,1.1vw,19px)}article h1{font-size:clamp(26px,2.1vw,38px);line-height:1.2;margin:0 0 6px}.meta{color:var(--dim);font-size:13.5px;margin-bottom:18px}
article mark{background:rgba(76,141,255,.28);color:inherit;border-radius:3px;padding:1px 0;box-shadow:0 0 0 3px rgba(76,141,255,.28)}
article mark.user{background:rgba(255,214,10,.42);box-shadow:0 0 0 3px rgba(255,214,10,.42)}
iframe{flex:1;border:0;width:100%;min-height:0;background:transparent}
.yt-player{position:relative;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#1c2233,#0b0e16);margin-bottom:14px;overflow:hidden}
.yt-play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.14)}.yt-play:after{content:"";position:absolute;left:25px;top:19px;border-left:21px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.yt-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.2)}.yt-bar i{display:block;width:8%;height:100%;background:#e5484d}
.yt-time{position:absolute;left:12px;bottom:12px;font-size:12px;color:#e8eaf0;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:5px}
.yt-chan{display:flex;gap:10px;align-items:center;margin:8px 0 14px;font-size:14px}.yt-chan b{display:block}.yt-av{width:34px;height:34px;border-radius:50%;background:var(--sig);flex:none}
.yt-tr{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}.yt-tr h4{margin:0 0 6px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.yt-tr p{display:flex;gap:12px;margin:0 0 8px;font-size:15px;line-height:1.5}.yt-tr .st{flex:0 0 52px;color:var(--sig);font-size:13px;font-variant-numeric:tabular-nums;padding-top:1px}
.pdfv{background:#4a4f5c;padding:0 0 28px;min-height:100%}
.pdfv .tb{background:#2f323b;color:#d8dbe4;font-size:12.5px;padding:8px 14px;display:flex;justify-content:space-between}
.pdfv .sheet{background:#fff;color:#1b1d26;margin:22px auto 0;width:min(86%,640px);padding:34px 40px;border-radius:2px;box-shadow:0 6px 22px rgba(0,0,0,.35);font-family:Georgia,serif;font-size:15px;line-height:1.55}
.pdfv .sheet h1{font-family:Georgia,serif;font-size:26px;margin:0 0 4px}.pdfv .sheet .meta{color:#666;font-family:system-ui,sans-serif}.pdfv .sheet p{margin:0 0 12px}.pdfv .sheet mark{color:#1b1d26}
.jr{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sig);font-weight:600;margin-bottom:6px}.jr span{color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px}
.doi{display:inline-block;margin:0 0 14px;font-size:13px;color:var(--sig)}
article mark.ghost{background:rgba(186,230,253,.65);color:#0369a1;border-bottom:2px dashed #0284c7;border-radius:2px;padding:0 2px;box-shadow:none;cursor:pointer}
#ai-ghost-menu{position:absolute;z-index:9;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;gap:6px;font-size:12px}
#ai-ghost-menu b{padding:4px 8px;border-radius:4px;font-weight:700}#ai-ghost-menu .keep{background:#fef08a;border:1px solid #fde047;color:#854d0e}#ai-ghost-menu .no{background:#f1f5f9;border:1px solid #cbd5e1;color:#475569;font-weight:400}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--dim)}
/* The embedding page chooses the theme (?theme=…); it wins over the OS preference. */
:root[data-theme=dark]{color-scheme:dark;--bg:#0e1017;--card:#171a23;--ink:#eef0f6;--dim:#9aa1b4;--line:#262a37}
:root[data-theme=light]{color-scheme:light;--bg:#f6f7fb;--card:#fff;--ink:#14161f;--dim:#5b6070;--line:#e3e6ef}
@media(max-width:820px){.stage{grid-template-columns:1fr;grid-template-rows:200px minmax(0,1fr)}article{padding:16px 18px}}
/* ?chrome=0 — the product alone: no sample page, no title bars, no borders, no padding, no page background.
   Meant for embedding the extension UI in a screenshot, a landing-page hero, or an <iframe> of your own. */
:root[data-chrome="0"] body{background:transparent}
:root[data-chrome="0"] .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);padding:0;gap:0}
:root[data-chrome="0"] .page{display:none}
:root[data-chrome="0"] .panel{border:0;border-radius:0;background:transparent}
:root[data-chrome="0"] .panel>.bar{display:none}
/* ?article=0 — keep the framed panel, drop only the sample article (centred, popup-width). */
:root[data-article="0"] .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);justify-items:center}
:root[data-article="0"] .page{display:none}
:root[data-article="0"] .panel{width:min(100%,clamp(400px,32vw,620px))}
/* ?layout=stack — sample article on top, product below, at any width (vertical video, phone-shaped embeds). */
:root[data-layout="stack"] .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,24%) minmax(0,1fr)}
</style></head><body>
<div class="stage">
<section class="page"><div class="bar"><i></i><i></i><i></i><span>example.com/the-quiet-comeback-of-the-long-read</span></div>
<article id="art"></article></section>
<section class="panel"><div class="bar"><i></i><i></i><i></i><span id="panelLabel">AI Summary Helper · side panel</span></div>
<iframe id="app" title="AI Summary Helper"></iframe></section>
</div>
<script src="app/demo-content.js"></script><script src="app/demo-i18n.js"></script><script src="app/demo-tour-i18n.js"></script><!--LANG--><script src="app/demo-scenarios-i18n.js"></script><script src="app/demo-scenarios.js"></script>
<script>
const P = new URLSearchParams(location.search), LOC = window.AISH_DEMO.locale, appFrame = document.getElementById('app');
// URL parameters (all optional):
//   lang=de          UI language of the popup
//   theme=light|dark  force a theme (otherwise the OS preference)
//   tour=0|1         hide the guided tour / force it on (default: show once, then remember)
//   chrome=0         product only — no sample page, title bars, borders, padding or background
//   article=0        keep the framed panel but hide the sample article
//   layout=stack     sample article above the product (any width), for vertical video
//   clock=manual     virtual clock for frame-exact capture (see AISH_CLOCK in demo-shim.js)
//   surface=popup    render the popup surface instead of the side panel
//   screen=main|history|feeds|settings   open that screen on load
//   panel=language|length|mode|model|account|models|prompts|feeds|feedprefs|reading|send|phoneinbox|appearance|accessibility|library|about
//                    open a settings panel (implies screen=settings)
const flag = (k) => P.get(k) === '0' ? '0' : P.get(k) === '1' ? '1' : null;
if (flag('chrome') === '0') document.documentElement.setAttribute('data-chrome', '0');
if (flag('article') === '0') document.documentElement.setAttribute('data-article', '0');
if (P.get('layout') === 'stack') document.documentElement.setAttribute('data-layout', 'stack');
if (P.get('clock') === 'manual') { const si = Element.prototype.scrollIntoView; Element.prototype.scrollIntoView = function (o) { return si.call(this, o && typeof o === 'object' ? { ...o, behavior: 'auto' } : o); }; }
if (LOC) { document.documentElement.lang = LOC.ui.replace('_', '-'); document.getElementById('panelLabel').textContent = 'AI Summary Helper · ' + LOC.side; document.title = LOC.article.title + ' – AI Summary Helper'; }
if (P.get('theme') === 'light' || P.get('theme') === 'dark') document.documentElement.setAttribute('data-theme', P.get('theme'));
appFrame.src = 'app/popup.html?surface=' + (P.get('surface') === 'popup' ? 'popup' : 'sidepanel') + (P.get('lang') ? '&lang=' + encodeURIComponent(P.get('lang')) : '') + (P.get('theme') ? '&theme=' + P.get('theme') : '') + (P.get('clock') === 'manual' ? '&clock=manual' : '') + (/^[a-z]+$/.test(P.get('scenario') || '') ? '&scenario=' + P.get('scenario') : '') + (/^\d+$/.test(P.get('ttsms') || '') ? '&ttsms=' + P.get('ttsms') : '');

// ?screen= / ?panel= — drive the popup into a feature mode once it has rendered.
// The popup is same-origin, so we click its real nav items and settings rows rather than
// reaching into module internals: the demo then behaves exactly like a user's click.
const SCREENS = ['main', 'history', 'feeds', 'settings'];
const PANELS = ['account', 'models', 'prompts', 'feeds', 'feedprefs', 'reading', 'send', 'phoneinbox', 'appearance', 'accessibility', 'library', 'about'];
const wantScreen = SCREENS.includes(P.get('screen')) ? P.get('screen') : null;
const wantPanel = PANELS.includes(P.get('panel')) ? P.get('panel') : null;
if (wantScreen || wantPanel) {
  const click = (d, sel) => { const el = d.querySelector(sel); if (el) { el.click(); return true; } return false; };
  const apply = () => {
    let d; try { d = appFrame.contentDocument; } catch (_) { return false; }
    if (!d || d.readyState !== 'complete' || !d.querySelector('.nav-item[data-screen=main]')) return false;
    if (wantPanel) {
      // Settings is a header button; the panel is a row inside the settings home.
      click(d, '#settingsButton');
      setTimeout(() => click(d, '.settings-row[data-panel="' + wantPanel + '"]'), 120);
    } else if (wantScreen) {
      click(d, '.nav-item[data-screen="' + wantScreen + '"]');
    }
    return true;
  };
  const boot = setInterval(() => { if (apply()) clearInterval(boot); }, 250);
  setTimeout(() => clearInterval(boot), 15000);
}
const A = window.AISH_DEMO.article, art0 = document.getElementById('art'), PG = window.AISH_DEMO.page;
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// The address in the page's title bar follows the page (a scenario can be a YouTube watch page, a PDF ...)
try { const u = new URL(window.AISH_DEMO.tab.url); if (window.AISH_DEMO.scenario) document.querySelector('.page .bar span').textContent = u.hostname.replace(/^www\./, '') + u.pathname + u.search; } catch (_) { /* keep the default */ }
if (PG && PG.kind === 'youtube') {
  art0.innerHTML = '<div class="yt-player"><div class="yt-play"></div><div class="yt-bar"><i></i></div><span class="yt-time">0:00 / ' + esc(PG.duration) + '</span></div>'
    + '<h1>' + esc(A.title) + '</h1><div class="yt-chan"><span class="yt-av"></span><span><b>' + esc(PG.channel) + '</b><span class="meta" style="margin:0">' + esc(PG.meta) + '</span></span></div>'
    + '<div class="yt-tr"><h4>' + esc(PG.transcript || 'Transcript') + '</h4>' + A.paragraphs.map((t, i) => '<p><span class="st">' + esc(PG.stamps[i] || '') + '</span><span>' + esc(t) + '</span></p>').join('') + '</div>';
} else if (PG && PG.kind === 'pdf') {
  art0.style.padding = '0'; art0.style.flex = '1'; art0.style.background = '#4a4f5c';
  art0.innerHTML = '<div class="pdfv"><div class="tb"><span>' + esc(PG.name) + '</span><span>1 / ' + PG.pages + ' &nbsp;·&nbsp; 100%</span></div><div class="sheet"><h1>' + esc(A.title) + '</h1><div class="meta">' + esc(A.byline) + '</div><br>' + A.paragraphs.map((t) => '<p>' + esc(t) + '</p>').join('') + '</div></div>';
} else if (PG && PG.kind === 'paper') {
  art0.innerHTML = '<div class="jr">' + esc(PG.journal) + '<span>' + esc(PG.volume) + '</span></div><h1>' + esc(A.title) + '</h1><div class="meta">' + esc(PG.authors) + '</div><a class="doi">https://doi.org/' + esc(PG.doi) + '</a>' + A.paragraphs.map((t) => '<p>' + esc(t) + '</p>').join('');
} else {
  art0.innerHTML = '<h1></h1><div class="meta"></div>' + A.paragraphs.map(() => '<p></p>').join('');
  art0.querySelector('h1').textContent = A.title; art0.querySelector('.meta').textContent = A.byline;
  art0.querySelectorAll('p').forEach((el, i) => { el.textContent = A.paragraphs[i]; });
}
// Ghost highlights (content/highlighter.js): the AI's key passages, dashed blue; click one to keep (yellow) or dismiss it.
const ghostMenu = (mark) => {
  let m = document.getElementById('ai-ghost-menu'); if (!m) { m = document.createElement('div'); m.id = 'ai-ghost-menu'; document.body.appendChild(m); }
  const r = mark.getBoundingClientRect();
  m.innerHTML = '<b class="keep">⭐ Keep</b><b class="no">✕ Dismiss</b>'; m.style.left = Math.max(8, r.left + scrollX) + 'px'; m.style.top = (r.top + scrollY - 44) + 'px'; m.style.display = 'flex';
};
// The popup (an iframe running the real extension UI) tells us which passage an answer came from.
addEventListener('message', (e) => {
  const m = e.data;
  if (m && m.aishDemo && m.type === 'theme' && (m.theme === 'light' || m.theme === 'dark')) { document.documentElement.setAttribute('data-theme', m.theme); if (e.source !== appFrame.contentWindow) { try { appFrame.contentWindow.postMessage(m, '*'); } catch (_) { /* not ready */ } } return; }   // from the host: pass on to the popup; from the popup (Appearance): only the page follows
  // highlight: the panel shows where an answer came from (blue); { user: true } is a reader's own marker (yellow, videos)
  if (m && m.aishDemo && m.type === 'ghost') {
    const art = document.getElementById('art'); if (art.querySelector('mark.ghost, mark.user')) return;
    (m.quotes || []).forEach((q) => { const w = document.createTreeWalker(art, NodeFilter.SHOW_TEXT); let n;
      while ((n = w.nextNode())) { const i = n.nodeValue.indexOf(q); if (i < 0) continue; const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length); const k = document.createElement('mark'); k.className = 'ghost'; k.title = 'AI highlight — click to keep or dismiss'; r.surroundContents(k); break; } });
    return;
  }
  // one ghost is picked (the first); it opens its menu, then turns yellow. Repeated messages change nothing more.
  if (m && m.aishDemo && m.type === 'ghost-menu') { if (!window.__ghostKept) { const g = document.querySelector('#art mark.ghost'); if (g) ghostMenu(g); } return; }
  if (m && m.aishDemo && m.type === 'ghost-keep') {
    if (window.__ghostKept) return;
    const g = document.querySelector('#art mark.ghost'); if (!g) return;
    window.__ghostKept = true; const menu = document.getElementById('ai-ghost-menu'); if (menu) menu.style.display = 'none';
    g.className = 'user'; g.title = 'Click to remove highlight';
    return;
  }
  if (!m || !m.aishDemo || m.type !== 'highlight') return;
  const art = document.getElementById('art'); art.querySelectorAll('mark').forEach(x => x.replaceWith(...x.childNodes)); art.normalize();
  if (!m.quote) return;
  const w = document.createTreeWalker(art, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) { const i = n.nodeValue.toLowerCase().indexOf(m.quote.toLowerCase()); if (i < 0) continue;
    const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + m.quote.length); const k = document.createElement('mark'); if (m.user) k.className = 'user'; r.surroundContents(k); k.scrollIntoView({ behavior: 'smooth', block: 'center' }); break; }
});
</script>
<script src="app/demo-tour.js"></script></body></html>
