name: Deploy website to GitHub Pages

# Publishes the contents of website/ as the site root — so
# philffm.github.io/ai-summary-helper/ still maps to website/index.html
# and philffm.github.io/ai-summary-helper/fr/ still maps to
# website/fr/index.html. Moving the folder in the repo for tidiness does
# NOT change any live URL.
#
# One-time setup: repo Settings → Pages → Source → "GitHub Actions"
# (currently probably set to "Deploy from a branch"; switch it or this
# workflow's deploy step will have nothing to attach to).

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
