name: Translate & localize website content

on:
  push:
    branches: [main]
    paths:
      - 'site-src/**'
      - 'docs/i18n/locales.json'
  workflow_dispatch:
    inputs:
      locale:
        description: 'Only translate this locale (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Assemble docs/ from site-src/ templates + partials
        run: node scripts/build-site.mjs

      - name: Run translation pipeline
        id: translate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.locale }}" ]; then
            node scripts/translate.mjs --locale="${{ github.event.inputs.locale }}"
          else
            node scripts/translate.mjs
          fi

      # docs/ is generated (by build-site.mjs) and committed (GitHub Pages
      # serves it directly), so both the English pages AND the translated
      # lang/ output can change in one PR here. git-add stays scoped
      # explicitly rather than a blanket `-A`, which in a monorepo risks
      # sweeping up unrelated changes from the extension build.
      - name: Open pull request with the updated translations
        if: steps.translate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            docs/**
          commit-message: 'i18n: update translations for changed content'
          branch: i18n/auto-update
          delete-branch: true
          title: 'Translation update (automated)'
          body: |
            Auto-generated by `scripts/translate.mjs` via OpenRouter.

            This ran because source content changed since the last translation pass — see `i18n/manifest.json` for exactly which files/locales were considered stale and re-translated, and when.

            **Please review before merging** — this is machine-translated and machine-adapted copy.
          labels: |
            i18n
            automated
