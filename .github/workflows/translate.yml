name: Translate & localize website content

on:
  push:
    branches: [main]
    paths:
      - 'website/index.html'
      - 'website/blog/**.html'
      - 'website/i18n/locales.json'
  workflow_dispatch:
    inputs:
      locale:
        description: 'Only translate this locale (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: website

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run translation pipeline
        id: translate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.locale }}" ]; then
            node scripts/translate.mjs --locale="${{ github.event.inputs.locale }}"
          else
            node scripts/translate.mjs
          fi

      # Scoped to website/ only — a plain `git add -A` in a monorepo risks
      # sweeping up unrelated build artifacts from other parts of the repo
      # (extension build output, etc.) into a translation-only PR.
      - name: Open pull request with the updated translations
        if: steps.translate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            website/**
          commit-message: 'i18n: update translations for changed content'
          branch: i18n/auto-update
          delete-branch: true
          title: 'Translation update (automated)'
          body: |
            Auto-generated by `scripts/translate.mjs` via OpenRouter.

            This ran because source content changed since the last translation pass — see `website/i18n/manifest.json` for exactly which files/locales were considered stale and re-translated, and when.

            **Please review before merging** — this is machine-translated and machine-adapted copy.
          labels: |
            i18n
            automated

# ── Auto-merge note ─────────────────────────────────────────────────
# Left as a manual review step deliberately — see the original comment
# in this file's history if you want to add trusted-locale auto-merge.
