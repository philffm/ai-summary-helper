name: Translate & localize website content

# Runs whenever the canonical English content changes on main, or on a
# manual dispatch (e.g. to add a new locale without touching content).
# It never pushes straight to main — it opens a pull request so a human
# reviews the AI-generated/adapted copy before it goes live. Once you
# trust the pipeline for a given locale, you can switch that locale to
# auto-merge; see the note at the bottom of this file.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'blog/**.html'
      - 'i18n/locales.json'
  workflow_dispatch:
    inputs:
      locale:
        description: 'Only translate this locale (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run translation pipeline
        id: translate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.locale }}" ]; then
            node scripts/translate.mjs --locale="${{ github.event.inputs.locale }}"
          else
            node scripts/translate.mjs
          fi

      - name: Open pull request with the updated translations
        if: steps.translate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'i18n: update translations for changed content'
          branch: i18n/auto-update
          delete-branch: true
          title: 'Translation update (automated)'
          body: |
            Auto-generated by `scripts/translate.mjs` via OpenRouter (`${{ env.OPENROUTER_MODEL }}`).

            This ran because source content changed since the last translation pass — see `i18n/manifest.json` for exactly which files/locales were considered stale and re-translated, and when.

            **Please review before merging** — this is machine-translated and machine-adapted copy. Once a locale has proven reliable, its section of this workflow can be switched to auto-merge (see the note at the bottom of `.github/workflows/translate.yml`).
          labels: |
            i18n
            automated

# ── To auto-merge instead of PR-review for a specific trusted locale ──
# Once you're confident in a locale's quality, you can add a follow-up
# job here that runs `gh pr merge --auto` on PRs from this workflow
# where the diff only touches that locale's directory. Left as a manual
# step deliberately — auto-merging translated marketing copy without a
# human ever reading it once is a decision worth making explicitly, not
# a default.
