name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip gawk

      - name: Run build script
        run: |
          chmod +x build_chrome_extension.sh
          ./build_chrome_extension.sh

      - name: Commit version bump back to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage the changed files
          git add chrome-extension/manifest.json chrome-extension/manifest-android.json current_version.json chrome-extension/popup.html

          # Commit the changes (if any exist)
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bump version [skip ci]"

          # Ensure we have the latest remote main branch
          git fetch origin main

          # Rebase our new commit on top of the latest main to avoid conflicts
          git pull --rebase origin main

          # Push successfully to main
          git push origin HEAD:main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            chrome-extension-*.zip
            chrome-extension-android-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
