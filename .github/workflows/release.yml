      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip gawk

      # --- NEW STEP ---
      - name: Always use the latest version file from main
        run: |
          git fetch origin main
          # Force the runner to use the current_version.json from the absolute latest main branch
          git checkout origin/main -- current_version.json
      # --------------

      - name: Run build script
        run: |
          chmod +x build_chrome_extension.sh
          ./build_chrome_extension.sh

      - name: Commit version bump back to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage the changed files
          git add chrome-extension/manifest.json chrome-extension/manifest-android.json current_version.json chrome-extension/popup.html

          # Commit the changes (if any exist)
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: bump version [skip ci]"

          # Ensure we have the latest remote main branch
          git fetch origin main

          # Rebase our new commit on top of the latest main
          git pull --rebase -X theirs origin main

          # Push successfully to main
          git push origin HEAD:main