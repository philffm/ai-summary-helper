name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: two runs would both read the same version and both try to bump it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip gawk

      # Tags are cut from main, which ci.yml already linted and tested on push — don't run it a second time.
      # A manual run can start from any ref, so that one still checks.
      - name: Run tests (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci --no-audit --no-fund
          npm run lint -- --quiet   # errors only (undefined identifiers etc.)
          npm run test:release   # all tests, the audits and the translation check

      - name: Always use the latest version file from main
        run: |
          git fetch origin main
          # Force the runner to use the current_version.json from the absolute latest main branch
          git checkout origin/main -- current_version.json

      - name: Run build script
        run: |
          chmod +x plugin/build.sh
          cd plugin
          ./build.sh

      # The bump is re-applied onto the newest main rather than rebased: it only sets the version in files whose
      # version line nobody else edits, so there is nothing to resolve and nothing to overwrite. If main moves
      # between fetch and push, fetch and stamp again; after 5 tries the job fails instead of forcing anything.
      - name: Commit version bump to main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          VERSION=$(jq -r '.version' current_version.json)
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --force -B release-bump origin/main
            plugin/scripts/set-version.sh "$VERSION"
            git add plugin/platforms/*/manifest.json current_version.json plugin/src/popup.html
            if git diff --staged --quiet; then echo "main already at $VERSION"; exit 0; fi
            git commit -m "chore: bump version to $VERSION [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved during the push (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          echo "could not push the version bump to main" >&2
          exit 1

      - name: Extract version for release tag
        id: get_version
        run: |
          # Read the newly bumped version from the JSON file
          VERSION=$(jq -r '.version' current_version.json)
          # Save it as an environment variable (e.g., v2.0.26) for the next step
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }} # Force it to use the new version as the tag
          generate_release_notes: true
          files: |
            plugin/prod/aish-extension-chrome-*.zip
            plugin/prod/aish-extension-android-*.zip
            plugin/prod/aish-extension-firefox-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}