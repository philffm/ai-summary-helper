name: Deploy website

# Publishes docs/ (the hand-written site) plus the live demo (built from plugin/src, never committed) to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".

# The demo follows the RELEASES, not every commit: it is built from the latest v* tag (see the step below) and redeployed when
# a release has finished. Pushes to docs/ (the site itself) deploy as before, with the demo of the last release.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/legacy-lang-stubs.mjs'
      - 'scripts/indexnow.mjs'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Build and Release Extension']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # a release that failed publishes nothing new
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The demo is the extension of the latest release, not of whatever is on main right now. Falls back to main when there is no
      # tag yet or the tag predates the demo.
      - name: Use the demo sources of the latest release
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$TAG" ] && git cat-file -e "$TAG:plugin/scripts/build-demo.mjs" 2>/dev/null; then
            rm -rf plugin/src plugin/demo plugin/scripts/build-demo.mjs
            git checkout "$TAG" -- plugin/src plugin/demo plugin/scripts/build-demo.mjs
            echo "Demo built from $TAG"
          else
            echo "Demo built from main (no usable release tag: '$TAG')"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install site validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the live demo (fails if the mock lacks a popup action)
        run: node plugin/scripts/build-demo.mjs --check
      # docs/ is committed, so the sitemap is only regenerated when someone runs
      # `npm run site:build` locally. Validate it here so a malformed sitemap
      # (Google: "Couldn't fetch") can never reach Pages.
      - name: Validate sitemap.xml
        run: node --test scripts/tests/sitemap-links.test.mjs scripts/tests/localized-paths.test.mjs scripts/tests/css-tokens.test.mjs && node scripts/check-sitemap.mjs
      # The sitemap that is live right now, so IndexNow only gets the pages this deploy changes.
      - name: Save the live sitemap
        run: curl -fsSL https://ai-summary-helper.byphil.eu/sitemap.xml -o "$RUNNER_TEMP/sitemap-before.xml" || true
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/demo
          cp -R plugin/dist/demo/. _site/demo/
          # Old /lang/<code>/… URLs: redirect stubs to the new /<code>/… pages (Pages has no server-side 301)
          node scripts/legacy-lang-stubs.mjs _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Bing & co. pick up new and changed pages right away. Never fails the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs --before "$RUNNER_TEMP/sitemap-before.xml"
