name: Deploy website

# Publishes docs/ (the hand-written site) plus the live demo (built from plugin/src, never committed) to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'plugin/src/**'
      - 'plugin/demo/**'
      - 'plugin/scripts/build-demo.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the live demo (fails if the mock lacks a popup action)
        run: node plugin/scripts/build-demo.mjs --check
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/demo
          cp -R plugin/dist/demo/. _site/demo/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
