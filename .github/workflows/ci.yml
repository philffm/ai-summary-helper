name: CI

# Pull requests: lint + the tests a change can reach (import graph, `npm test -- --deep`). Missing translations do not fail a pull request.
# main, tags and a nightly run: every test, the audits and the translation check (`npm run test:release`), the gate before a release.
# Nightly also checks the hand-vendored libraries in plugin/src/lib against npm advisories (scripts/check-vendored-libs.mjs).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AISH_TEST_SPEED: '4'   # timer speed-up for the tests (see plugin/tests/env.mjs); gentler than locally because CI runners are small

jobs:
  # Secret scan (gitleaks, config .gitleaks.toml). Pull requests and pushes: the new commits, blocking.
  # Nightly: the whole history, reported as a warning only (an old, already rotated key must not keep main red:
  # put its fingerprint in .gitleaksignore after rotating it).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the new commits
        if: github.event_name != 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then RANGE="origin/${{ github.base_ref }}..HEAD";
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then RANGE="${{ github.event.before }}..${{ github.sha }}";
          else RANGE="-1"; fi
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE" .
      - name: Scan the whole history (report only)
        if: github.event_name == 'schedule'
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner . || echo "::warning title=gitleaks::secrets found in the history - rotate, then add the fingerprints to .gitleaksignore"

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the runner compares with origin/main to find the affected tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Lint (errors only)
        run: npm run lint -- --quiet
      - name: Live demo still builds and its mock covers every popup action
        run: npm run demo:check
      - name: Validate sitemap and internal links
        run: node --test scripts/tests/sitemap-links.test.mjs scripts/tests/carousel-accessibility.test.mjs scripts/tests/css-tokens.test.mjs && node scripts/check-sitemap.mjs && node scripts/tag-store-links.mjs --check
      - name: Vendored libraries match their documented versions
        run: node scripts/check-vendored-libs.mjs --offline
      - name: Tests the change can reach
        run: npm test -- --deep
      # Dead files (knip.json): a source file nothing imports fails the run. A file kept on purpose goes into knip.json "entry".
      - name: No unused files
        run: npx knip --include files --reporter compact
      # Unused exports: report only for now (the list is in the job summary); it does not fail the run.
      - name: Unused exports (report)
        continue-on-error: true
        run: |
          npx knip --reporter markdown > knip-report.md || true
          { echo '### knip: unused files and exports'; cat knip-report.md; } >> "$GITHUB_STEP_SUMMARY"

  release-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write      # flaky tests are filed as one issue per test (scripts/report-flaky.mjs)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Lint (errors only)
        run: npm run lint -- --quiet
      - name: Every test, the audits and the translation check
        run: npm run test:release
        env:
          AISH_FLAKY_FILE: ${{ runner.temp }}/flaky-tests.json
      - name: Report flaky tests as issues
        if: always()
        run: node scripts/report-flaky.mjs "$RUNNER_TEMP/flaky-tests.json"
        env:
          GH_TOKEN: ${{ github.token }}
      # npm audit can't see plugin/src/lib (vendored by hand): check it against npm releases and advisories.
      # Nightly only; keeps one issue up to date and closes it once everything is clean. Never fails the run.
      - name: Vendored libraries - advisories and updates
        if: always() && github.event_name == 'schedule'
        run: node scripts/check-vendored-libs.mjs --issue
        env:
          GH_TOKEN: ${{ github.token }}
